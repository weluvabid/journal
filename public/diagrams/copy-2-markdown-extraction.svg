<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">Copy2Markdown · Extraction pipeline</title><desc id="desc">Relevant source content is acquired, selected, normalized and emitted as portable Markdown.</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b7b7b7"/></marker>
 <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a7a0ff"/></marker>
 <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8bc5b5"/></marker>
 <style>
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#f2f2f2; }
  .title { font-size:30px; font-weight:650; letter-spacing:-.5px; }
  .subtitle { font-size:15px; fill:#b7b7b7; }
  .section { font-size:14px; font-weight:650; letter-spacing:1.1px; fill:#b7b7b7; }
  .label { font-size:17px; font-weight:600; }
  .small { font-size:14px; fill:#b7b7b7; }
  .tiny { font-size:12px; fill:#b7b7b7; }
  .card { fill:#1b1b1b; stroke:#777777; stroke-width:1.5; rx:13; }
  .cardAccent { fill:#202020; stroke:#a7a0ff; stroke-width:1.7; rx:13; }
  .cardGreen { fill:#202020; stroke:#8bc5b5; stroke-width:1.7; rx:13; }
  .line { fill:none; stroke:#b7b7b7; stroke-width:2.2; marker-end:url(#arrow); }
  .lineAccent { fill:none; stroke:#a7a0ff; stroke-width:2.5; marker-end:url(#arrowAccent); }
  .lineGreen { fill:none; stroke:#8bc5b5; stroke-width:2.5; marker-end:url(#arrowGreen); }
  .dash { fill:none; stroke:#d7b779; stroke-width:2; stroke-dasharray:7 6; marker-end:url(#arrow); }
 </style>
</defs>
<rect width="100%" height="100%" fill="#121212"/>
<text x="64" y="62" class="title">Copy2Markdown · Extraction pipeline</text>
<text x="64" y="91" class="subtitle">Relevant source content is acquired, selected, normalized and emitted as portable Markdown.</text>
<text x="64" y="166" class="section">SOURCE</text><rect x="64" y="205" width="230" height="120" class="card"/><text x="179.0" y="257.0" text-anchor="middle" class="label">Source page / document</text><text x="179.0" y="284.0" text-anchor="middle" class="small">HTML DOM or webpage</text><text x="360" y="166" class="section">1 · ACQUISITION</text><rect x="360" y="205" width="230" height="120" class="card"/><text x="475.0" y="257.0" text-anchor="middle" class="label">Content acquisition</text><text x="475.0" y="284.0" text-anchor="middle" class="small">fetch markup and assets</text><text x="656" y="166" class="section">2 · SELECTION</text><rect x="656" y="205" width="230" height="120" class="cardAccent"/><text x="771.0" y="257.0" text-anchor="middle" class="label">Content extraction</text><text x="771.0" y="284.0" text-anchor="middle" class="small">prune boilerplate; keep main content</text><text x="952" y="166" class="section">3 · TRANSFORMATION</text><rect x="952" y="205" width="230" height="120" class="card"/><text x="1067.0" y="257.0" text-anchor="middle" class="label">Conversion &amp; normalization</text><text x="1067.0" y="284.0" text-anchor="middle" class="small">map semantic nodes to standard tokens</text><text x="1248" y="166" class="section">OUTPUT</text><rect x="1248" y="205" width="150" height="120" class="cardGreen"/><text x="1323.0" y="257.0" text-anchor="middle" class="label">Markdown</text><text x="1323.0" y="284.0" text-anchor="middle" class="small">.md document</text><path d="M294 265 L360 265" class="lineAccent"/><path d="M590 265 L656 265" class="lineAccent"/><path d="M886 265 L952 265" class="lineAccent"/><path d="M1182 265 L1248 265" class="lineAccent"/><text x="720" y="405" text-anchor="middle" class="small">A focused content pipeline: acquire → select → normalize → emit</text></svg>
