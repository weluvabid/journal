<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">Frontend Atlas · Progress transfer</title><desc id="desc">Accountless transfer moves learning progress directly from the original device to a receiving device.</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b7b7b7"/></marker>
 <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a7a0ff"/></marker>
 <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8bc5b5"/></marker>
 <style>
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#f2f2f2; }
  .title { font-size:30px; font-weight:650; letter-spacing:-.5px; }
  .subtitle { font-size:15px; fill:#b7b7b7; }
  .section { font-size:14px; font-weight:650; letter-spacing:1.1px; fill:#b7b7b7; }
  .label { font-size:17px; font-weight:600; }
  .small { font-size:14px; fill:#b7b7b7; }
  .tiny { font-size:12px; fill:#b7b7b7; }
  .card { fill:#1b1b1b; stroke:#777777; stroke-width:1.5; rx:13; }
  .cardAccent { fill:#202020; stroke:#a7a0ff; stroke-width:1.7; rx:13; }
  .cardGreen { fill:#202020; stroke:#8bc5b5; stroke-width:1.7; rx:13; }
  .line { fill:none; stroke:#b7b7b7; stroke-width:2.2; marker-end:url(#arrow); }
  .lineAccent { fill:none; stroke:#a7a0ff; stroke-width:2.5; marker-end:url(#arrowAccent); }
  .lineGreen { fill:none; stroke:#8bc5b5; stroke-width:2.5; marker-end:url(#arrowGreen); }
  .dash { fill:none; stroke:#d7b779; stroke-width:2; stroke-dasharray:7 6; marker-end:url(#arrow); }
 </style>
</defs>
<rect width="100%" height="100%" fill="#121212"/>
<text x="64" y="62" class="title">Frontend Atlas · Progress transfer</text>
<text x="64" y="91" class="subtitle">Accountless transfer moves learning progress directly from the original device to a receiving device.</text>
<text x="64" y="160" class="section">ORIGINAL DEVICE</text><rect x="64" y="195" width="300" height="160" class="cardAccent"/><text x="214.0" y="267.0" text-anchor="middle" class="label">Learning progress</text><text x="214.0" y="294.0" text-anchor="middle" class="small">stored in local state</text><rect x="64" y="405" width="300" height="90" class="card"/><text x="214.0" y="442.0" text-anchor="middle" class="label">Serialize &amp; compress</text><text x="214.0" y="469.0" text-anchor="middle" class="small">manifest · status · positions · checksum</text><path d="M214 355 L214 405" class="lineAccent"/><text x="500" y="160" class="section">DIRECT QR TRANSFER</text><rect x="500" y="195" width="300" height="160" class="cardAccent"/><text x="650.0" y="267.0" text-anchor="middle" class="label">QR code display</text><text x="650.0" y="294.0" text-anchor="middle" class="small">self-contained encoded payload</text><rect x="500" y="405" width="300" height="90" class="card"/><text x="650.0" y="442.0" text-anchor="middle" class="label">Optical scan</text><text x="650.0" y="469.0" text-anchor="middle" class="small">camera captures QR code</text><path d="M650 355 L650 405" class="lineAccent"/><text x="940" y="160" class="section">RECEIVING DEVICE</text><rect x="940" y="195" width="420" height="110" class="card"/><text x="1150.0" y="242.0" text-anchor="middle" class="label">Decode &amp; validate</text><text x="1150.0" y="269.0" text-anchor="middle" class="small">verify and unpack payload</text><rect x="940" y="385" width="420" height="110" class="cardGreen"/><text x="1150.0" y="432.0" text-anchor="middle" class="label">Restore learning progress</text><text x="1150.0" y="459.0" text-anchor="middle" class="small">write transferred state to local storage</text><path d="M800 450 L875 450" class="lineAccent"/><path d="M875 450 V250 H940" class="lineAccent"/><path d="M1150 305 L1150 385" class="lineGreen"/><text x="720" y="560" text-anchor="middle" class="small">Device-to-device transfer · no account or cloud synchronization</text></svg>
