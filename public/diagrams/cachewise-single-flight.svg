<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
<title id="title">Cachewise · Single-flight execution</title><desc id="desc">Concurrent requests for the same key join one active operation and receive its result.</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b7b7b7"/></marker>
 <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a7a0ff"/></marker>
 <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8bc5b5"/></marker>
 <style>
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#f2f2f2; }
  .title { font-size:30px; font-weight:650; letter-spacing:-.5px; }
  .subtitle { font-size:15px; fill:#b7b7b7; }
  .section { font-size:14px; font-weight:650; letter-spacing:1.1px; fill:#b7b7b7; }
  .label { font-size:15px; font-weight:600; }
  .small { font-size:12px; fill:#b7b7b7; }
  .tiny { font-size:12px; fill:#b7b7b7; }
  .card { fill:#1b1b1b; stroke:#777777; stroke-width:1.5; rx:13; }
  .cardAccent { fill:#202020; stroke:#a7a0ff; stroke-width:1.7; rx:13; }
  .cardGreen { fill:#202020; stroke:#8bc5b5; stroke-width:1.7; rx:13; }
  .line { fill:none; stroke:#b7b7b7; stroke-width:2.2; marker-end:url(#arrow); }
  .lineAccent { fill:none; stroke:#a7a0ff; stroke-width:2.5; marker-end:url(#arrowAccent); }
  .lineGreen { fill:none; stroke:#8bc5b5; stroke-width:2.5; marker-end:url(#arrowGreen); }
  .dash { fill:none; stroke:#d7b779; stroke-width:2; stroke-dasharray:7 6; marker-end:url(#arrow); }
 </style>
</defs>
<rect width="100%" height="100%" fill="#121212"/>
<text x="64" y="62" class="title">Cachewise · Single-flight execution</text>
<text x="64" y="91" class="subtitle">Concurrent requests for the same key join one active operation and receive its result.</text>
<text x="64" y="160" class="section">CONCURRENT CALLERS · KEY K</text><rect x="64" y="190" width="210" height="76" class="cardAccent"/><text x="169.0" y="220.0" text-anchor="middle" class="label">Caller 1</text><text x="169.0" y="247.0" text-anchor="middle" class="small">initiator</text><rect x="64" y="300" width="210" height="76" class="card"/><text x="169.0" y="330.0" text-anchor="middle" class="label">Caller 2</text><text x="169.0" y="357.0" text-anchor="middle" class="small">follower</text><rect x="64" y="410" width="210" height="76" class="card"/><text x="169.0" y="440.0" text-anchor="middle" class="label">Caller 3</text><text x="169.0" y="467.0" text-anchor="middle" class="small">follower</text><text x="390" y="160" class="section">SINGLE-FLIGHT REGISTRY</text><rect x="390" y="205" width="250" height="110" class="cardAccent"/><text x="515.0" y="252.0" text-anchor="middle" class="label">Lookup key K</text><text x="515.0" y="279.0" text-anchor="middle" class="small">active flight exists?</text><rect x="760" y="205" width="250" height="110" class="cardGreen"/><text x="885.0" y="252.0" text-anchor="middle" class="label">In-flight operation</text><text x="885.0" y="279.0" text-anchor="middle" class="small">one execution for key K</text><rect x="1120" y="205" width="250" height="110" class="card"/><text x="1245.0" y="252.0" text-anchor="middle" class="label">Underlying work</text><text x="1245.0" y="279.0" text-anchor="middle" class="small">fetch / compute once</text><path d="M274 228 H330 V260 H390" class="lineAccent"/><path d="M274 338 H330 V260" class="line"/><path d="M274 448 H350 V260" class="line"/><path d="M640 260 L760 260" class="lineAccent"/><path d="M1010 260 L1120 260" class="line"/><text x="690" y="238" class="tiny">join / wait</text><text x="760" y="390" class="section">COMPLETION</text><rect x="760" y="420" width="250" height="82" class="cardGreen"/><text x="885.0" y="453.0" text-anchor="middle" class="label">Resolve shared result</text><text x="885.0" y="480.0" text-anchor="middle" class="small">same value to all waiters</text><path d="M1245 315 L1245 460" class="line"/><path d="M1245 460 H1010" class="lineGreen"/><path d="M885 502 V548 H350 V228 H274" class="lineGreen"/><path d="M350 548 V338 H274" class="lineGreen"/><path d="M350 548 V448 H274" class="lineGreen"/><rect x="1120" y="420" width="250" height="82" class="card"/><text x="1245.0" y="453.0" text-anchor="middle" class="label">Cleanup</text><text x="1245.0" y="480.0" text-anchor="middle" class="small">delete in-flight key K</text><path d="M1010 461 L1120 461" class="line"/><text x="710" y="580" text-anchor="middle" class="small">One operation · one shared completion · remove the active-flight entry</text></svg>
