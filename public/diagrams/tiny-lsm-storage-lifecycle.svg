<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">TinyLSM · Storage lifecycle</title><desc id="desc">Writes become immutable sorted files; compaction organizes them while reads consult memory and disk.</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b7b7b7"/></marker>
 <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a7a0ff"/></marker>
 <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8bc5b5"/></marker>
 <style>
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#f2f2f2; }
  .title { font-size:30px; font-weight:650; letter-spacing:-.5px; }
  .subtitle { font-size:15px; fill:#b7b7b7; }
  .section { font-size:14px; font-weight:650; letter-spacing:1.1px; fill:#b7b7b7; }
  .label { font-size:15px; font-weight:600; }
  .small { font-size:12px; fill:#b7b7b7; }
  .tiny { font-size:12px; fill:#b7b7b7; }
  .card { fill:#1b1b1b; stroke:#777777; stroke-width:1.5; rx:13; }
  .cardAccent { fill:#202020; stroke:#a7a0ff; stroke-width:1.7; rx:13; }
  .cardGreen { fill:#202020; stroke:#8bc5b5; stroke-width:1.7; rx:13; }
  .line { fill:none; stroke:#b7b7b7; stroke-width:2.2; marker-end:url(#arrow); }
  .lineAccent { fill:none; stroke:#a7a0ff; stroke-width:2.5; marker-end:url(#arrowAccent); }
  .lineGreen { fill:none; stroke:#8bc5b5; stroke-width:2.5; marker-end:url(#arrowGreen); }
  .dash { fill:none; stroke:#d7b779; stroke-width:2; stroke-dasharray:7 6; marker-end:url(#arrow); }
 </style>
</defs>
<rect width="100%" height="100%" fill="#121212"/>
<text x="64" y="62" class="title">TinyLSM · Storage lifecycle</text>
<text x="64" y="91" class="subtitle">Writes become immutable sorted files; compaction organizes them while reads consult memory and disk.</text>
<text x="64" y="145" class="section">WRITE PATH</text><rect x="64" y="174" width="190" height="82" class="cardAccent"/><text x="159.0" y="207.0" text-anchor="middle" class="label">Write request</text><text x="159.0" y="234.0" text-anchor="middle" class="small">key · value</text><rect x="320" y="174" width="220" height="82" class="cardAccent"/><text x="430.0" y="207.0" text-anchor="middle" class="label">Active MemTable</text><text x="430.0" y="234.0" text-anchor="middle" class="small">BTreeMap · mutable state</text><rect x="620" y="174" width="220" height="82" class="card"/><text x="730.0" y="207.0" text-anchor="middle" class="label">Ordered snapshot</text><text x="730.0" y="234.0" text-anchor="middle" class="small">awaiting flush</text><rect x="920" y="174" width="220" height="82" class="cardGreen"/><text x="1030.0" y="207.0" text-anchor="middle" class="label">Newest runs</text><text x="1030.0" y="234.0" text-anchor="middle" class="small">new SSTables · may overlap</text><path d="M254 215 L320 215" class="lineAccent"/><path d="M540 215 L620 215" class="line"/><path d="M840 215 L920 215" class="lineGreen"/><text x="64" y="340" class="section">PERSISTENT STORAGE</text><rect x="64" y="366" width="1312" height="270" rx="18" fill="#171717" stroke="#555" stroke-width="1.5"/><text x="92" y="402" class="section">DISK · SSTABLE LEVELS</text><rect x="110" y="430" width="330" height="150" class="card"/><text x="275.0" y="497.0" text-anchor="middle" class="label">Newest runs</text><text x="275.0" y="524.0" text-anchor="middle" class="small">immutable sorted runs</text><rect x="555" y="430" width="330" height="150" class="cardAccent"/><text x="720.0" y="497.0" text-anchor="middle" class="label">Older runs</text><text x="720.0" y="524.0" text-anchor="middle" class="small">immutable sorted runs</text><rect x="1000" y="430" width="330" height="150" class="cardGreen"/><text x="1165.0" y="497.0" text-anchor="middle" class="label">Compaction output</text><text x="1165.0" y="524.0" text-anchor="middle" class="small">k-way merged sorted run</text><path d="M440 505 L555 505" class="dash"/><path d="M885 505 L1000 505" class="dash"/><text x="497" y="480" text-anchor="middle" class="tiny">COMPACTION</text><text x="942" y="480" text-anchor="middle" class="tiny">COMPACTION</text><path d="M730 256 V300 H275 V430" class="line"/><text x="490" y="292" class="small">Flush → SSTable</text><text x="64" y="690" class="section">READ PATH</text><rect x="230" y="655" width="230" height="64" class="cardAccent"/><text x="345.0" y="693.0" text-anchor="middle" class="label">Read request</text><rect x="605" y="655" width="230" height="64" class="card"/><text x="720.0" y="693.0" text-anchor="middle" class="label">Check MemTable</text><rect x="980" y="655" width="300" height="64" class="cardGreen"/><text x="1130.0" y="693.0" text-anchor="middle" class="label">Search relevant SSTables</text><path d="M460 687 L605 687" class="line"/><path d="M835 687 L980 687" class="line"/></svg>
