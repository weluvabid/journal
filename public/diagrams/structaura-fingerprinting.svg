<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">Structaura · Fingerprinting pipeline</title><desc id="desc">A deterministic structural identity is derived from normalized hierarchical structure.</desc>
<defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b7b7b7"/></marker>
 <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a7a0ff"/></marker>
 <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8bc5b5"/></marker>
 <style>
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#f2f2f2; }
  .title { font-size:30px; font-weight:650; letter-spacing:-.5px; }
  .subtitle { font-size:15px; fill:#b7b7b7; }
  .section { font-size:14px; font-weight:650; letter-spacing:1.1px; fill:#b7b7b7; }
  .label { font-size:15px; font-weight:600; }
  .small { font-size:12px; fill:#b7b7b7; }
  .tiny { font-size:12px; fill:#b7b7b7; }
  .card { fill:#1b1b1b; stroke:#777777; stroke-width:1.5; rx:13; }
  .cardAccent { fill:#202020; stroke:#a7a0ff; stroke-width:1.7; rx:13; }
  .cardGreen { fill:#202020; stroke:#8bc5b5; stroke-width:1.7; rx:13; }
  .line { fill:none; stroke:#b7b7b7; stroke-width:2.2; marker-end:url(#arrow); }
  .lineAccent { fill:none; stroke:#a7a0ff; stroke-width:2.5; marker-end:url(#arrowAccent); }
  .lineGreen { fill:none; stroke:#8bc5b5; stroke-width:2.5; marker-end:url(#arrowGreen); }
  .dash { fill:none; stroke:#d7b779; stroke-width:2; stroke-dasharray:7 6; marker-end:url(#arrow); }
 </style>
</defs>
<rect width="100%" height="100%" fill="#121212"/>
<text x="64" y="62" class="title">Structaura · Fingerprinting pipeline</text>
<text x="64" y="91" class="subtitle">A deterministic structural identity is derived from normalized hierarchical structure.</text>
<text x="64" y="166" class="section">INPUT</text><rect x="64" y="205" width="210" height="120" class="card"/><text x="169.0" y="257.0" text-anchor="middle" class="label">Input data / AST</text><text x="169.0" y="284.0" text-anchor="middle" class="small">raw hierarchical payload</text><text x="330" y="166" class="section">1 · INGESTION</text><rect x="330" y="205" width="210" height="120" class="card"/><text x="435.0" y="257.0" text-anchor="middle" class="label">Structural extraction</text><text x="435.0" y="284.0" text-anchor="middle" class="small">identify nodes and relationships</text><text x="596" y="166" class="section">2 · TRAVERSAL</text><rect x="596" y="205" width="210" height="120" class="card"/><text x="701.0" y="257.0" text-anchor="middle" class="label">Topology-aware walk</text><text x="701.0" y="284.0" text-anchor="middle" class="small">visit structural nodes</text><text x="862" y="166" class="section">3 · NORMALIZATION</text><rect x="862" y="205" width="210" height="120" class="cardAccent"/><text x="967.0" y="257.0" text-anchor="middle" class="label">Structure normalization</text><text x="967.0" y="284.0" text-anchor="middle" class="tiny">Drop lexical noise; keep invariants</text><text x="1128" y="166" class="section">4–5 · GENERATION</text><rect x="1128" y="205" width="248" height="120" class="cardGreen"/><text x="1252.0" y="257.0" text-anchor="middle" class="label">Fingerprint synthesis</text><text x="1252.0" y="284.0" text-anchor="middle" class="small">deterministic recursive state fold</text><path d="M274 265 L330 265" class="lineAccent"/><path d="M540 265 L596 265" class="lineAccent"/><path d="M806 265 L862 265" class="lineAccent"/><path d="M1072 265 L1128 265" class="lineAccent"/><rect x="500" y="390" width="440" height="70" class="cardGreen"/><text x="720.0" y="417.0" text-anchor="middle" class="label">Structural fingerprint</text><text x="720.0" y="444.0" text-anchor="middle" class="small">invariant structural hash / ID</text><path d="M1252 325 L1252 360" class="line"/><path d="M1252 360 H720 V390" class="lineGreen"/></svg>
